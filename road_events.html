<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101722">
<title>Road Events</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0b111a; --panel:#121b28; --panel2:#172334; --text:#edf3f8;
    --muted:#9eacbb; --accent:#7dd3fc; --accent2:#a7f3d0; --border:#2a394c;
    --danger:#fca5a5;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; background:
      radial-gradient(circle at top, #18273a 0, var(--bg) 42rem);
    color:var(--text); font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  main { width:min(980px,100%); margin:auto; padding:18px 14px 40px; }
  header { margin-bottom:16px; }
  h1 { font-size:clamp(22px,6vw,32px); line-height:1.1; margin:0 0 5px; }
  .subtitle { color:var(--muted); margin:0; }
  .tabs {
    display:flex; gap:5px; margin-bottom:14px; padding:4px;
    background:var(--panel2); border:1px solid var(--border); border-radius:13px;
  }
  .tabs a {
    flex:1; min-height:44px; display:grid; place-items:center; padding:8px 10px;
    border-radius:9px; text-decoration:none; color:var(--muted); font-weight:750;
  }
  .tabs a:hover { color:var(--text); }
  .tabs a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .tabs a[aria-current="page"] {
    background:#1e3a52; color:var(--text); box-shadow:inset 0 0 0 1px #315a76;
  }
  .panel {
    background:color-mix(in srgb,var(--panel) 94%,transparent);
    border:1px solid var(--border); border-radius:16px; padding:14px;
    box-shadow:0 12px 35px #0005;
  }
  .controls { display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:end; }
  label { display:block; color:var(--muted); font-size:12px; font-weight:700; margin:0 0 5px; text-transform:uppercase; letter-spacing:.06em; }
  select,button {
    width:100%; min-height:48px; border-radius:11px; border:1px solid var(--border);
    background:var(--panel2); color:var(--text); padding:10px 12px; font:inherit;
  }
  select:focus,button:focus { outline:2px solid var(--accent); outline-offset:2px; }
  button { cursor:pointer; font-weight:750; background:#1e3a52; border-color:#315a76; }
  button:active { transform:translateY(1px); }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:12px; }
  .stat { background:var(--panel2); border:1px solid var(--border); border-radius:12px; padding:11px; }
  .stat .k { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
  .stat .v { font-size:20px; font-weight:800; margin-top:2px; }
  .results { margin-top:14px; display:grid; gap:12px; }
  .route { overflow:hidden; }
  .route-head { display:flex; justify-content:space-between; gap:10px; align-items:center; margin-bottom:10px; }
  .route-title { font-weight:800; }
  .route-distance { color:var(--accent); font-weight:800; white-space:nowrap; }
  .timeline { display:grid; gap:7px; }
  .stop {
    display:grid; grid-template-columns:30px 1fr; gap:10px; position:relative;
  }
  .stop:not(:last-child)::after {
    content:""; position:absolute; left:14px; top:30px; bottom:-7px; width:2px; background:var(--border);
  }
  .dot {
    width:30px; height:30px; border-radius:50%; display:grid; place-items:center;
    background:#203348; border:1px solid #3d5973; color:var(--accent); font-size:12px; z-index:1;
  }
  .stop-card { background:var(--panel2); border:1px solid var(--border); border-radius:11px; padding:8px 10px; min-width:0; }
  .stop-name { font-weight:750; overflow-wrap:anywhere; }
  .stop-miles { color:var(--muted); font-size:12px; }
  .events { margin-top:10px; display:grid; gap:7px; }
  .event {
    border:1px solid var(--border); border-radius:11px; padding:9px 10px;
    background:#101a27;
  }
  .event.encounter { border-color:#435b4e; background:#13221e; }
  .event.vending { border-color:#4b5871; }
  .event.heal { border-color:#684e4e; }
  .event-type { font-weight:800; margin-bottom:4px; }
  .event-detail { color:#cbd5df; white-space:pre-wrap; overflow-wrap:anywhere; }
  .legend { color:var(--muted); font-size:12px; margin-top:10px; }
  .empty { color:var(--muted); text-align:center; padding:28px 8px; }
  @media (max-width:650px) {
    main { padding:14px 10px 28px; }
    .controls { grid-template-columns:1fr 1fr; }
    .controls button { grid-column:1 / -1; }
    .stats { grid-template-columns:1fr 1fr 1fr; }
    .stat { padding:9px 7px; }
    .stat .v { font-size:17px; }
  }
  @media (min-width:651px) {
    .results { grid-template-columns:1fr 1fr; align-items:start; }
    .route { grid-column:1 / -1; }
  }
</style>
</head>
<body>
<main>
  <nav class="tabs">
    <a href="road_events.html" aria-current="page">Road</a>
    <a href="town_events.html">Town</a>
  </nav>

  <header>
    <h1>Road Events</h1>
    <p class="subtitle">Choose two locations to calculate the shortest route and generate its encounters.</p>
  </header>

  <section class="panel">
    <div class="controls">
      <div>
        <label for="from">From</label>
        <select id="from"></select>
      </div>
      <div>
        <label for="to">To</label>
        <select id="to"></select>
      </div>
      <button id="go" type="button">Generate route</button>
    </div>
    <div id="stats" class="stats" hidden></div>
  </section>

  <section id="results" class="results"></section>
</main>

<script src="game_data.js"></script>
<script>
"use strict";

const POINTS_PER_MILE = 88.89799472710779;
const MILES_PER_ENCOUNTER = 3;

const key = (u,v) => `${u}|${v}`;
const undirectedEdgeKey = (u,v) => {
  const a = [u,v].sort(); return `${a[0]}|${a[1]}`;
};

/*
 * Equivalent to the Python apsp() implementation, with a next-node
 * matrix so that answer_query can reconstruct the actual shortest path.
 */
function apsp(nodes, rawEdges) {
  const names = Object.keys(nodes);
  const dist = Object.fromEntries(names.map(u => [u, Object.fromEntries(names.map(v => [v, Infinity]))]));
  const nextNode = Object.fromEntries(names.map(u => [u, Object.fromEntries(names.map(v => [v, null]))]));

  for (const n of names) { dist[n][n]=0; nextNode[n][n]=n; }

  for (const [u,v,d] of rawEdges) {
    if (d < dist[u][v]) {
      dist[u][v]=d; dist[v][u]=d;
      nextNode[u][v]=v; nextNode[v][u]=u;
    }
  }

  for (const w of names)
    for (const u of names)
      for (const v of names) {
        const nd=dist[u][w]+dist[w][v];
        if (nd < dist[u][v]) {
          dist[u][v]=nd;
          nextNode[u][v]=nextNode[u][w];
        }
      }

  function path(u,v) {
    if (nextNode[u][v] === null) return null;
    const result=[[u,0]];
    while (u !== v) {
      const x=nextNode[u][v];
      const d=dist[u][x];
      u=x; result.push([u,d]);
    }
    return result;
  }
  return {dist,path};
}

// Calculate edge weights from coordinates, including the doubled mountain edge.
const weightedEdges = edges.map(([u,v]) => {
  const [ux,uy]=nodes[u], [vx,vy]=nodes[v];
  let d=Math.hypot(ux-vx,uy-vy);
  if ((u==="mountain_approach" && v==="mount_arbora") ||
      (u==="mount_arbora" && v==="mountain_approach")) d*=2;
  return [u,v,d];
});

const {dist,path} = apsp(nodes, weightedEdges);

function queryDistance(u,v) {
  return Math.round(dist[u][v] / POINTS_PER_MILE);
}

function queryEncounters(u,v) {
  const encounterCount = Math.floor(queryDistance(u,v) / MILES_PER_ENCOUNTER);
  const encounterLocations=[];
  const uvPath=path(u,v);
  let traveled=0, p=u;

  for (const [x,d] of uvPath) {
    traveled += d / POINTS_PER_MILE;
    const segmentEncounters=Math.floor(traveled / MILES_PER_ENCOUNTER);
    traveled %= MILES_PER_ENCOUNTER;
    for (let i=0;i<segmentEncounters;i++) encounterLocations.push([p,x]);
    p=x;
  }
  return [encounterCount, encounterLocations];
}

function ingredientsForEdge(u,v) {
  return Array.from({length:3}, () => randomChoice([...nodeIngredients[u],...nodeIngredients[v]]));
}

function eventsForPath(u,v) {
  const [encounterCount, encounterLocations]=queryEncounters(u,v);
  const encounterEnvs=encounterLocations.map(edge => {
    const [a,b] = edge;
    const envs = edgeEnvironments[key(a,b)] ||
                 edgeEnvironments[key(b,a)] ||
                 edgeEnvironments[undirectedEdgeKey(a,b)] || [];
    return envs.length ? randomChoice(envs) : null;
  });

  const events=[];
  for (let i=0;i<encounterLocations.length;i++) {
    const env=encounterEnvs[i];
    const roll=Math.random()*6; // weights 1,2,3
    if (roll < 1) {
      events.push({type:"heal",title:"Heal",detail:"50%"});
    } else if (roll < 3) {
      events.push({
        type:"vending", title:"Vending Machine",
        detail:stockDetail(ingredientsForEdge(u,v))
      });
    } else {
      events.push({type:"encounter",title:"Encounter",detail:`${env}: ${monsterForEnv(env)}`});
    }
  }
  return events;
}

function answer_query(u,v) {
  const uvPath=path(u,v).map(([x,d]) => [x,d/POINTS_PER_MILE]);
  for (let i=1;i<uvPath.length;i++) uvPath[i][1]+=uvPath[i-1][1];
  return [uvPath,eventsForPath(u,v)];
}

const from=document.querySelector("#from"), to=document.querySelector("#to");
populateLocationSelect(from);
populateLocationSelect(to);
to.value="land_of_hot_water";

function render() {
  const u=from.value, v=to.value;
  const [route,events]=answer_query(u,v);
  const distance=queryDistance(u,v);
  const encounterCount=queryEncounters(u,v)[0];

  const stats=document.querySelector("#stats");
  stats.hidden=false;
  stats.innerHTML=`
    <div class="stat"><div class="k">Distance</div><div class="v">${distance} mi</div></div>
    <div class="stat"><div class="k">Encounters</div><div class="v">${encounterCount}</div></div>
    <div class="stat"><div class="k">Nodes</div><div class="v">${route.length}</div></div>`;

  let html=`<section class="panel route">
    <div class="route-head">
      <div class="route-title">${escapeHtml(pretty(u))} → ${escapeHtml(pretty(v))}</div>
      <div class="route-distance">${distance} mi</div>
    </div>
    <div class="timeline">`;

  route.forEach(([node,miles],i) => {
    html+=`<div class="stop">
      <div class="dot">${i+1}</div>
      <div class="stop-card">
        <div class="stop-name">${escapeHtml(pretty(node))}</div>
        <div class="stop-miles">${miles.toFixed(1)} mi from origin</div>
      </div>
    </div>`;
  });
  html+=`</div><div class="legend">${events.length} generated event${events.length===1?"":"s"} along the route.</div></section>`;

  html+=`<section class="panel"><div class="route-title">Events</div><div class="events">`;
  if (!events.length) {
    html+=`<div class="empty">No encounters on this route.</div>`;
  } else {
    events.forEach((e,i)=>{
      html+=`<article class="event ${e.type}">
        <div class="event-type">${i+1}. ${escapeHtml(e.title)}</div>
        <div class="event-detail">${escapeHtml(e.detail)}</div>
      </article>`;
    });
  }
  html+=`</div></section>`;
  document.querySelector("#results").innerHTML=html;
}

document.querySelector("#go").addEventListener("click",render);
from.addEventListener("change",render);
to.addEventListener("change",render);
render();
</script>
</body>
</html>
