<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101722">
<title>Town Events</title>
<link rel="stylesheet" href="style.css">
<style>
  .controls { grid-template-columns:1fr auto; }
  .event.shop { border-color:#4b5871; }
  @media (max-width:650px) {
    .controls { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<main>
  <nav class="tabs">
    <a href="road_events.html">Road</a>
    <a href="town_events.html" aria-current="page">Town</a>
  </nav>

  <header>
    <h1>Town Events</h1>
    <p class="subtitle">Choose a location to generate the shops currently trading there.</p>
  </header>

  <section class="panel">
    <div class="controls">
      <div>
        <label for="location">Location</label>
        <select id="location"></select>
      </div>
      <button id="go" type="button">Generate shops</button>
    </div>
    <div id="stats" class="stats" hidden></div>
  </section>

  <section id="results" class="results"></section>
</main>

<script src="game_data.js"></script>
<script>
"use strict";

const SHOPS_PER_TOWN = 3;

// Shops stock only what the node itself offers, unlike road vending machines
// which pool the ingredients of both endpoints of an edge.
function ingredientsForNode(n) {
  const pool = nodeIngredients[n] || [];
  return pool.length ? sample(pool,3) : [];
}

function shopsForNode(n) {
  return Array.from({length:SHOPS_PER_TOWN}, () => ({
    type:"shop", title:"Shop", detail:stockDetail(ingredientsForNode(n))
  }));
}

const locationSel=document.querySelector("#location");
populateLocationSelect(locationSel);
locationSel.value="land_of_hot_water";

function render() {
  const n=locationSel.value;
  const events=shopsForNode(n);
  const poolSize=new Set(nodeIngredients[n] || []).size;

  const stats=document.querySelector("#stats");
  stats.hidden=false;
  stats.innerHTML=`
    <div class="stat"><div class="k">Shops</div><div class="v">${events.length}</div></div>
    <div class="stat"><div class="k">Local Ingredients</div><div class="v">${poolSize}</div></div>
    <div class="stat"><div class="k">Items per Shop</div><div class="v">6</div></div>`;

  let html=`<section class="panel full">
    <div class="card-head">
      <div class="card-title">${escapeHtml(pretty(n))}</div>
      <div class="card-note">${events.length} shop${events.length===1?"":"s"}</div>
    </div>
    <div class="events">`;

  if (!poolSize) {
    html+=`<div class="empty">No local ingredients are gathered here.</div>`;
  }
  events.forEach((e,i)=>{
    html+=`<article class="event ${e.type}">
      <div class="event-type">${i+1}. ${escapeHtml(e.title)}</div>
      <div class="event-detail">${escapeHtml(e.detail)}</div>
    </article>`;
  });
  html+=`</div><div class="legend">Shops stock only ingredients found at ${escapeHtml(pretty(n))}.</div></section>`;

  document.querySelector("#results").innerHTML=html;
}

document.querySelector("#go").addEventListener("click",render);
locationSel.addEventListener("change",render);
render();
</script>
</body>
</html>
